version: 1
settings:
  start_distance: 4.0
  end_distance: 5.0
  line_seconds: 1.5
  cooldown_seconds: 30.0
  initial_delay: 8.0
  max_duration: 90.0
scripts:
  - {id: blacksmith, file: blacksmith.yaml}
  - {id: beggar, file: beggar.yaml}
  - {id: beggar_nearby, file: beggar-nearby.yaml}
  - {id: recruit, file: recruit.yaml}
  - {id: greeting, file: greeting.yaml}
  - {id: companion, file: companion.yaml}
  - {id: request_recruitment, file: request-recruitment.yaml}
  - {id: small_talk, file: small-talk.yaml}
# Rules are tested in order. Zero participant IDs match any character.
rules:
  - {trigger: Interaction, talker: 0, target: 4, conditions: [Always], dialog: blacksmith}
  - {trigger: Interaction, talker: 0, target: 5, conditions: [Always], dialog: beggar}
  - {trigger: Interaction, talker: 0, target: 0, conditions: [CanRecruit], dialog: recruit}
  - {trigger: Interaction, talker: 0, target: 0, conditions: [SameParty], dialog: companion}
  - {trigger: Interaction, talker: 0, target: 0, conditions: [Always], dialog: greeting}
  - {trigger: Nearby, talker: 0, target: 0, conditions: [CanBeRecruited], dialog: request_recruitment}
  - {trigger: Nearby, talker: 5, target: 0, conditions: [Always], dialog: beggar_nearby}
  - {trigger: Nearby, talker: 0, target: 0, conditions: [Always], dialog: small_talk}
